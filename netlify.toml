# Netlify auto-detects Next.js and injects its runtime (@netlify/plugin-nextjs) —
# it is intentionally NOT pinned here. This file only overrides the build command
# so migrations run, pins Node, and helps bundle Prisma's native engine.

[build]
  # gen-redirects writes public/_redirects from NEXT_PUBLIC_BASE_PATH (bounces
  # this origin's bare "/" to the subpath mount point; no-op at the root).
  command = "node scripts/gen-redirects.mjs && npx prisma migrate deploy && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # Make sure the Prisma query engine and the argon2 native addon end up inside
  # the serverless function bundles.
  included_files = [
    "node_modules/.prisma/client/**",
    "node_modules/@node-rs/argon2-linux-*/**",
  ]

# The tick job (missed-sweep + reminders) and the nightly demo reset are plain
# Netlify scheduled functions in netlify/functions/ — schedules are declared in
# those files via `export const config`.
